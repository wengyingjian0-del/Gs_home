    <style id="theme-vars">
/* ========================================
   商图 Mobile — Dark Luxury Brand CSS
   ======================================== */

:root {
  /* --- Surface System (Dark) --- */
  --mt-bg-base: #0a0a0c;
  --mt-bg-elevated: #121216;
  --mt-bg-card: rgba(255, 255, 255, 0.035);
  --mt-bg-card-hover: rgba(255, 255, 255, 0.06);
  --mt-bg-glass: rgba(255, 255, 255, 0.045);
  --mt-bg-input: rgba(255, 255, 255, 0.025);
  --mt-bg-overlay: rgba(0, 0, 0, 0.72);

  /* --- Text System --- */
  --mt-text-primary: #f5f0e8;
  --mt-text-secondary: #9a958d;
  --mt-text-tertiary: #5c5a54;
  --mt-text-inverse: #0a0a0c;

  /* --- Brand Accent (Warm Gold) --- */
  --mt-gold: #d4a356;
  --mt-gold-bright: #e8bd6e;
  --mt-gold-deep: #b88638;
  --mt-gold-glow: rgba(212, 163, 86, 0.15);
  --mt-gold-glow-strong: rgba(212, 163, 86, 0.28);

  /* --- Status Colors --- */
  --mt-success: #5b9b6e;
  --mt-error: #c75c5c;
  --mt-warning: #d4a356;
  --mt-info: #6b8db5;

  /* --- Border System --- */
  --mt-border-subtle: rgba(255, 255, 255, 0.06);
  --mt-border-default: rgba(255, 255, 255, 0.09);
  --mt-border-strong: rgba(255, 255, 255, 0.14);
  --mt-border-gold: rgba(212, 163, 86, 0.3);

  /* --- Radius --- */
  --mt-radius-sm: 8px;
  --mt-radius-md: 12px;
  --mt-radius-lg: 16px;
  --mt-radius-xl: 20px;
  --mt-radius-full: 9999px;

  /* --- Shadows --- */
  --mt-shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 40px rgba(0,0,0,0.4);
  --mt-shadow-elevated: 0 1px 0 rgba(255,255,255,0.06) inset, 0 20px 60px rgba(0,0,0,0.5);
  --mt-shadow-gold: 0 0 24px rgba(212, 163, 86, 0.12);
  --mt-shadow-btn: 0 4px 16px rgba(212, 163, 86, 0.2);

  /* --- Typography --- */
  --mt-font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mt-font-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
  --mt-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;

  /* --- Tailwind Semantic Bridge Aliases (infrastructure) --- */
  --mt-background: var(--mt-bg-base);
  --mt-foreground: var(--mt-text-primary);
  --mt-card: var(--mt-bg-card);
  --mt-card-foreground: var(--mt-text-primary);
  --mt-popover: var(--mt-bg-elevated);
  --mt-popover-foreground: var(--mt-text-primary);
  --mt-primary: var(--mt-gold);
  --mt-primary-foreground: var(--mt-text-inverse);
  --mt-secondary: var(--mt-bg-card);
  --mt-secondary-foreground: var(--mt-text-secondary);
  --mt-muted: var(--mt-bg-elevated);
  --mt-muted-foreground: var(--mt-text-secondary);
  --mt-accent: var(--mt-gold-glow);
  --mt-accent-foreground: var(--mt-gold-bright);
  --mt-destructive: var(--mt-error);
  --mt-destructive-foreground: var(--mt-text-primary);
  --mt-border: var(--mt-border-default);
  --mt-input: var(--mt-bg-input);
  --mt-ring: var(--mt-gold);
}

/* --- Font Imports --- */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap');

/* --- Base --- */
* {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--mt-font-sans);
  background: var(--mt-bg-base);
  color: var(--mt-text-primary);
  margin: 0;
  line-height: 1.6;
}

/* --- Ambient Background --- */
.mt-ambient-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212, 163, 86, 0.08), transparent),
    radial-gradient(ellipse 60% 40% at 80% 30%, rgba(212, 163, 86, 0.04), transparent),
    radial-gradient(ellipse 50% 35% at 20% 60%, rgba(184, 134, 56, 0.03), transparent),
    var(--mt-bg-base);
}

/* --- Typography Classes --- */
.mt-font-display {
  font-family: var(--mt-font-serif);
  font-weight: 700;
  letter-spacing: -0.02em;
}

.mt-font-body {
  font-family: var(--mt-font-sans);
  font-weight: 400;
}

.mt-font-label {
  font-family: var(--mt-font-sans);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 11px;
}

/* --- Glass Card --- */
.mt-glass {
  background: var(--mt-bg-card);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border: 1px solid var(--mt-border-subtle);
  border-radius: var(--mt-radius-lg);
  box-shadow: var(--mt-shadow-card);
}

.mt-glass-elevated {
  background: var(--mt-bg-glass);
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border: 1px solid var(--mt-border-default);
  border-radius: var(--mt-radius-xl);
  box-shadow: var(--mt-shadow-elevated);
}

/* --- Gold Accent --- */
.mt-gold-text {
  color: var(--mt-gold);
}

.mt-gold-gradient {
  background: linear-gradient(135deg, var(--mt-gold-bright), var(--mt-gold-deep));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.mt-gold-border {
  border: 1px solid var(--mt-border-gold);
}

/* --- Button --- */
.mt-btn-gold {
  background: linear-gradient(135deg, var(--mt-gold), var(--mt-gold-deep));
  color: var(--mt-text-inverse);
  font-weight: 700;
  border: none;
  border-radius: var(--mt-radius-md);
  box-shadow: var(--mt-shadow-btn);
  transition: all 0.2s ease;
}

.mt-btn-gold:hover,
.mt-btn-gold:active {
  background: linear-gradient(135deg, var(--mt-gold-bright), var(--mt-gold));
  box-shadow: 0 6px 24px rgba(212, 163, 86, 0.3);
}

.mt-btn-ghost {
  background: var(--mt-bg-card);
  color: var(--mt-text-primary);
  border: 1px solid var(--mt-border-default);
  border-radius: var(--mt-radius-md);
  transition: all 0.2s ease;
}

.mt-btn-ghost:hover,
.mt-btn-ghost:active {
  background: var(--mt-bg-card-hover);
  border-color: var(--mt-border-strong);
}

/* --- Input --- */
.mt-input {
  background: var(--mt-bg-input);
  border: 1px solid var(--mt-border-default);
  border-radius: var(--mt-radius-md);
  color: var(--mt-text-primary);
  transition: all 0.2s ease;
}

.mt-input:focus {
  outline: none;
  border-color: var(--mt-border-gold);
  box-shadow: 0 0 0 3px var(--mt-gold-glow);
  background: rgba(255, 255, 255, 0.04);
}

.mt-input::placeholder {
  color: var(--mt-text-tertiary);
}

/* --- Chip / Tag --- */
.mt-chip {
  background: var(--mt-bg-card);
  border: 1px solid var(--mt-border-default);
  border-radius: var(--mt-radius-full);
  color: var(--mt-text-secondary);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  transition: all 0.2s ease;
  cursor: pointer;
  user-select: none;
}

.mt-chip:hover {
  border-color: var(--mt-border-strong);
  color: var(--mt-text-primary);
}

.mt-chip.active {
  background: var(--mt-gold-glow);
  border-color: var(--mt-border-gold);
  color: var(--mt-gold-bright);
}

/* --- Scrollbar --- */
::-webkit-scrollbar {
  width: 0;
  height: 0;
}

/* --- Animations --- */
@keyframes mt-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes mt-glow-pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(212, 163, 86, 0.1); }
  50% { box-shadow: 0 0 32px rgba(212, 163, 86, 0.2); }
}

@keyframes mt-fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.mt-animate-fade-up {
  animation: mt-fade-up 0.5s ease-out both;
}

/* --- Mobile Container --- */
.mt-mobile-frame {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
}

    <main>

    <style id="critical-layout">
      /* --- Critical Layout: Mobile Viewer Page --- */
      html, body {
        overflow-x: hidden;
        max-width: 100vw;
      }
      .mt-mobile-frame {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      /* Sticky top bar with glass effect */
      .viewer-top-bar {
        background: var(--mt-bg-overlay);
        backdrop-filter: blur(20px) saturate(1.2);
        -webkit-backdrop-filter: blur(20px) saturate(1.2);
        border-bottom: 1px solid var(--mt-border-subtle);
      }
      /* Hero image — responsive height, never overflows */
      .viewer-hero-img {
        display: block;
        width: 100%;
        height: 360px;
        object-fit: cover;
        object-position: center;
      }
      @media (max-width: 375px) {
        .viewer-hero-img { height: 300px; }
      }
      /* Divider line using brand token */
      .viewer-divider {
        border-top: 1px solid var(--mt-border-subtle);
      }
      /* Hover / active state for icon buttons */
      .viewer-btn-hover {
        transition: background-color 0.2s ease, color 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .viewer-btn-hover:hover,
      .viewer-btn-hover:active {
        background-color: var(--mt-bg-card-hover);
      }
    </style>
    <script>lucide.createIcons();</script>
    <script>
      // 读取 sessionStorage 中的真实图片
      var viewerImage = sessionStorage.getItem('mt_viewer_image');
      var viewerPrompt = sessionStorage.getItem('mt_viewer_prompt') || '';
      if (viewerImage) {
        var imgEl = document.getElementById('viewer-image');
        if (imgEl) {
          imgEl.src = viewerImage;
          imgEl.onerror = function() { imgEl.src = '../assets/result-ramen.jpg'; };
        }
      }
      // 返回按钮 → 结果页
      var backBtn = document.querySelector('[data-dom-id="back-result"]');
      if (backBtn) backBtn.addEventListener('click', function() { window.location.href = 'result.html'; });

      // Toast 提示函数
      function showToast(message, type) {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;transition:opacity 0.3s;background:' + (type === 'error' ? 'rgba(199,92,92,0.95)' : type === 'warning' ? 'rgba(212,163,86,0.95)' : 'rgba(91,155,110,0.95)') + ';color:#fff;backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,0,0,0.3);';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(function() { toast.style.opacity = '0'; setTimeout(function() { toast.remove(); }, 300); }, 2800);
      }

      // 底部操作按钮
      // 下载按钮
      var btnDl = document.getElementById('viewer-download');
      if (btnDl) btnDl.addEventListener('click', function() {
        var imgSrc = document.getElementById('viewer-image').src;
        var a = document.createElement('a');
        a.href = imgSrc;
        a.download = 'merchant-image.jpg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('图片下载已开始');
      });

      // 分享按钮
      var btnShare = document.getElementById('viewer-share');
      if (btnShare) btnShare.addEventListener('click', function() {
        var imgSrc = document.getElementById('viewer-image').src;
        if (navigator.share) {
          navigator.share({
            title: '商图作品',
            text: '来看看这张AI生成的图片',
            url: imgSrc
          }).then(function() {
            showToast('分享成功');
          }).catch(function() {
            showToast('分享已取消');
          });
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(imgSrc).then(function() {
            showToast('链接已复制到剪贴板');
          }).catch(function() {
            showToast('复制失败', 'error');
          });
        } else {
          showToast('当前环境不支持分享');
        }
      });

      // 设为封面按钮
      var btnCover = document.getElementById('viewer-cover');
      if (btnCover) {
        var isCover = false;
        btnCover.addEventListener('click', function() {
          isCover = !isCover;
          var starIcon = btnCover.querySelector('i');
          if (isCover) {
            if (starIcon) starIcon.style.color = 'var(--mt-gold)';
            btnCover.style.color = 'var(--mt-gold)';
            showToast('已设为封面');
          } else {
            if (starIcon) starIcon.style.color = '';
            btnCover.style.color = 'var(--mt-text-secondary)';
            showToast('已取消封面');
          }
        });
      }

      // 删除按钮
      var btnDel = document.getElementById('viewer-delete');
      if (btnDel) btnDel.addEventListener('click', function() {
        showToast('已删除，返回作品页');
        setTimeout(function() {
          window.location.href = 'result.html';
        }, 1000);
      });

      // 顶部"更多"按钮
      var moreBtn = document.querySelector('[aria-label="更多"]');
      if (moreBtn) {
        moreBtn.addEventListener('click', function() {
          showToast('更多功能开发中');
        });
      }
    </script>
</body>
</html>
