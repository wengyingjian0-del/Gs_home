<head>

    <style id="theme-vars">
/* ========================================
   商图 Mobile — Dark Luxury Brand CSS
   ======================================== */

:root {
  /* --- Surface System (Dark) --- */
  --mt-bg-base: #0a0a0c;
  --mt-bg-elevated: #121216;
  --mt-bg-card: rgba(255, 255, 255, 0.035);
  --mt-bg-card-hover: rgba(255, 255, 255, 0.06);
  --mt-bg-glass: rgba(255, 255, 255, 0.045);
  --mt-bg-input: rgba(255, 255, 255, 0.025);
  --mt-bg-overlay: rgba(0, 0, 0, 0.72);

  /* --- Text System --- */
  --mt-text-primary: #f5f0e8;
  --mt-text-secondary: #9a958d;
  --mt-text-tertiary: #5c5a54;
  --mt-text-inverse: #0a0a0c;

  /* --- Brand Accent (Warm Gold) --- */
  --mt-gold: #d4a356;
  --mt-gold-bright: #e8bd6e;
  --mt-gold-deep: #b88638;
  --mt-gold-glow: rgba(212, 163, 86, 0.15);
  --mt-gold-glow-strong: rgba(212, 163, 86, 0.28);

  /* --- Status Colors --- */
  --mt-success: #5b9b6e;
  --mt-error: #c75c5c;
  --mt-warning: #d4a356;
  --mt-info: #6b8db5;

  /* --- Border System --- */
  --mt-border-subtle: rgba(255, 255, 255, 0.06);
  --mt-border-default: rgba(255, 255, 255, 0.09);
  --mt-border-strong: rgba(255, 255, 255, 0.14);
  --mt-border-gold: rgba(212, 163, 86, 0.3);

  /* --- Radius --- */
  --mt-radius-sm: 8px;
  --mt-radius-md: 12px;
  --mt-radius-lg: 16px;
  --mt-radius-xl: 20px;
  --mt-radius-full: 9999px;

  /* --- Shadows --- */
  --mt-shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 40px rgba(0,0,0,0.4);
  --mt-shadow-elevated: 0 1px 0 rgba(255,255,255,0.06) inset, 0 20px 60px rgba(0,0,0,0.5);
  --mt-shadow-gold: 0 0 24px rgba(212, 163, 86, 0.12);
  --mt-shadow-btn: 0 4px 16px rgba(212, 163, 86, 0.2);

  /* --- Typography --- */
  --mt-font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mt-font-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
  --mt-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;

  /* --- Tailwind Semantic Bridge Aliases (infrastructure) --- */
  --mt-background: var(--mt-bg-base);
  --mt-foreground: var(--mt-text-primary);
  --mt-card: var(--mt-bg-card);
  --mt-card-foreground: var(--mt-text-primary);
  --mt-popover: var(--mt-bg-elevated);
  --mt-popover-foreground: var(--mt-text-primary);
  --mt-primary: var(--mt-gold);
  --mt-primary-foreground: var(--mt-text-inverse);
  --mt-secondary: var(--mt-bg-card);
  --mt-secondary-foreground: var(--mt-text-secondary);
  --mt-muted: var(--mt-bg-elevated);
  --mt-muted-foreground: var(--mt-text-secondary);
  --mt-accent: var(--mt-gold-glow);
  --mt-accent-foreground: var(--mt-gold-bright);
  --mt-destructive: var(--mt-error);
  --mt-destructive-foreground: var(--mt-text-primary);
  --mt-border: var(--mt-border-default);
  --mt-input: var(--mt-bg-input);
  --mt-ring: var(--mt-gold);
}

/* --- Font Imports --- */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap');

/* --- Base --- */
* {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--mt-font-sans);
  background: var(--mt-bg-base);
  color: var(--mt-text-primary);
  margin: 0;
  line-height: 1.6;
}

/* --- Ambient Background --- */
.mt-ambient-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212, 163, 86, 0.08), transparent),
    radial-gradient(ellipse 60% 40% at 80% 30%, rgba(212, 163, 86, 0.04), transparent),
    radial-gradient(ellipse 50% 35% at 20% 60%, rgba(184, 134, 56, 0.03), transparent),
    var(--mt-bg-base);
}

/* --- Typography Classes --- */
.mt-font-display {
  font-family: var(--mt-font-serif);
  font-weight: 700;
  letter-spacing: -0.02em;
}

.mt-font-body {
  font-family: var(--mt-font-sans);
  font-weight: 400;
}

.mt-font-label {
  font-family: var(--mt-font-sans);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 11px;
}

/* --- Glass Card --- */
.mt-glass {
  background: var(--mt-bg-card);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border: 1px solid var(--mt-border-subtle);
  border-radius: var(--mt-radius-lg);
  box-shadow: var(--mt-shadow-card);
}

.mt-glass-elevated {
  background: var(--mt-bg-glass);
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border: 1px solid var(--mt-border-default);
  border-radius: var(--mt-radius-xl);
  box-shadow: var(--mt-shadow-elevated);
}

/* --- Gold Accent --- */
.mt-gold-text {
  color: var(--mt-gold);
}

.mt-gold-gradient {
  background: linear-gradient(135deg, var(--mt-gold-bright), var(--mt-gold-deep));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.mt-gold-border {
  border: 1px solid var(--mt-border-gold);
}

/* --- Button --- */
.mt-btn-gold {
  background: linear-gradient(135deg, var(--mt-gold), var(--mt-gold-deep));
  color: var(--mt-text-inverse);
  font-weight: 700;
  border: none;
  border-radius: var(--mt-radius-md);
  box-shadow: var(--mt-shadow-btn);
  transition: all 0.2s ease;
}

.mt-btn-gold:hover,
.mt-btn-gold:active {
  background: linear-gradient(135deg, var(--mt-gold-bright), var(--mt-gold));
  box-shadow: 0 6px 24px rgba(212, 163, 86, 0.3);
}

.mt-btn-ghost {
  background: var(--mt-bg-card);
  color: var(--mt-text-primary);
  border: 1px solid var(--mt-border-default);
  border-radius: var(--mt-radius-md);
  transition: all 0.2s ease;
}

.mt-btn-ghost:hover,
.mt-btn-ghost:active {
  background: var(--mt-bg-card-hover);
  border-color: var(--mt-border-strong);
}

/* --- Input --- */
.mt-input {
  background: var(--mt-bg-input);
  border: 1px solid var(--mt-border-default);
  border-radius: var(--mt-radius-md);
  color: var(--mt-text-primary);
  transition: all 0.2s ease;
}

.mt-input:focus {
  outline: none;
  border-color: var(--mt-border-gold);
  box-shadow: 0 0 0 3px var(--mt-gold-glow);
  background: rgba(255, 255, 255, 0.04);
}

.mt-input::placeholder {
  color: var(--mt-text-tertiary);
}

/* --- Chip / Tag --- */
.mt-chip {
  background: var(--mt-bg-card);
  border: 1px solid var(--mt-border-default);
  border-radius: var(--mt-radius-full);
  color: var(--mt-text-secondary);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  transition: all 0.2s ease;
  cursor: pointer;
  user-select: none;
}

.mt-chip:hover {
  border-color: var(--mt-border-strong);
  color: var(--mt-text-primary);
}

.mt-chip.active {
  background: var(--mt-gold-glow);
  border-color: var(--mt-border-gold);
  color: var(--mt-gold-bright);
}

/* --- Scrollbar --- */
::-webkit-scrollbar {
  width: 0;
  height: 0;
}

/* --- Animations --- */
@keyframes mt-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes mt-glow-pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(212, 163, 86, 0.1); }
  50% { box-shadow: 0 0 32px rgba(212, 163, 86, 0.2); }
}

@keyframes mt-fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.mt-animate-fade-up {
  animation: mt-fade-up 0.5s ease-out both;
}

/* --- Mobile Container --- */
.mt-mobile-frame {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
}

<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="mt-ambient-bg"></div>
      <div class="mt-mobile-frame">

            </button>
            <h1 class="mt-font-display text-base" style="color: var(--mt-text-primary);">商家信息</h1>
            <button type="button" class="text-sm font-semibold whitespace-nowrap px-2" style="color: var(--mt-gold);">保存</button>
          </div>
        </header>

        <!-- Content -->
        <div class="flex-1 px-4 py-5 space-y-4">

          <!-- Avatar Section -->
          <section class="mt-glass-elevated p-6 flex flex-col items-center text-center mt-animate-fade-up">
            <div class="w-20 h-20 rounded-full flex items-center justify-center mb-3" style="border: 2px solid var(--mt-gold); background: linear-gradient(135deg, var(--mt-gold-glow-strong), var(--mt-bg-elevated)); box-shadow: var(--mt-shadow-gold);">
              <span class="mt-font-display text-2xl" style="color: var(--mt-gold-bright);">蜀</span>
            </div>
            <h2 class="mt-font-display text-xl" style="color: var(--mt-text-primary);">蜀香坊</h2>
            <div class="mt-2 inline-flex items-center gap-1 px-2.5 py-1 rounded-full" style="background: var(--mt-gold-glow); border: 1px solid var(--mt-border-gold);">
              <i data-lucide="badge-check" class="w-3.5 h-3.5" style="color: var(--mt-gold-bright);"></i>
              <span class="text-xs font-semibold whitespace-nowrap" style="color: var(--mt-gold-bright);">已认证</span>
            </div>
            <button type="button" class="mt-1 text-xs" style="color: var(--mt-text-secondary);">编辑头像</button>
          </section>

          <!-- Profile Form -->
          <section class="mt-glass p-4">

                <i data-lucide="soup" class="w-6 h-6" style="color: var(--mt-gold-bright);"></i>
              </div>
              <div class="w-16 h-16 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, var(--mt-gold-glow), var(--mt-bg-elevated)); border: 1px solid var(--mt-border-default);">
                <i data-lucide="cake" class="w-6 h-6" style="color: var(--mt-gold);"></i>
              </div>
            </div>
          </section>

          <!-- Save Button -->
          <button type="button" class="mt-btn-gold w-full py-3.5 text-base font-bold flex items-center justify-center gap-2 whitespace-nowrap" style="box-shadow: var(--mt-shadow-btn), var(--mt-shadow-gold);">
            <i data-lucide="check" class="w-5 h-5"></i>
            <span>保存修改</span>
          </button>

          <!-- Admin Entry -->
          <a data-dom-id="cta-admin" class="mt-glass p-4 flex items-center justify-between cursor-pointer transition-all" style="border: 1px solid var(--mt-border-gold);">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background: var(--mt-gold-glow); border: 1px solid var(--mt-border-gold);">
                <i data-lucide="settings-2" class="w-5 h-5" style="color: var(--mt-gold-bright);"></i>
              </div>
              <div>
                <div class="text-sm font-semibold" style="color: var(--mt-text-primary);">运营配置中心</div>
                <div class="text-xs mt-0.5" style="color: var(--mt-text-tertiary);">模型参数 · 功能开关 · 敏感词管理</div>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5" style="color: var(--mt-text-tertiary);"></i>
          </a>

        </div>

        <!-- Bottom Navigation -->
        <nav data-mobile-nav="global" class="w-full h-[64px] border-t border-white/[0.06] bg-[rgba(10,10,12,0.95)] backdrop-blur-xl"><div class="w-full h-full grid grid-cols-3 max-w-[430px] mx-auto"><a data-nav-key="workspace" data-dom-id="nav-workspace" class="flex flex-col items-center justify-center gap-0.5 h-full cursor-pointer" style="color:var(--mt-text-tertiary)"><i data-lucide="layout-grid" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap">工作台</span></a><a data-nav-key="result" data-dom-id="nav-result" class="flex flex-col items-center justify-center gap-0.5 h-full cursor-pointer" style="color:var(--mt-text-tertiary)"><i data-lucide="image" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap">作品</span></a><a data-nav-key="profile" data-dom-id="nav-profile" class="flex flex-col items-center justify-center gap-0.5 h-full cursor-pointer" data-active="true" style="color:var(--mt-gold)"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap font-semibold">我的</span></a></div></nav>
      </div>
    </main>
    <style id="critical-layout">
      html, body { overflow-x: hidden; }
      .mt-mobile-frame { display: flex; flex-direction: column; min-height: 100vh; }
      .mt-mobile-frame > header { position: sticky; top: 0; z-index: 40; }
      [data-mobile-nav="global"] { position: sticky; bottom: 0; z-index: 50; }
      .mt-ambient-bg { pointer-events: none; }
    </style>
    <script>lucide.createIcons();</script>
    <script>
      // 底部导航跳转
      document.querySelectorAll('[data-nav-key]').forEach(function(el) {
        el.addEventListener('click', function() {
          var key = el.getAttribute('data-nav-key');
          var map = { workspace: 'workspace.html', result: 'result.html', profile: 'profile.html' };
          if (map[key]) window.location.href = map[key];
        });
      });
      // 返回按钮 → 工作台
      var backBtn = document.querySelector('[aria-label="返回"]');
      if (backBtn) backBtn.addEventListener('click', function() { window.location.href = 'workspace.html'; });
      // 运营配置中心 → 登录验证页（普通用户无法直接进入后台）
      var ctaAdmin = document.querySelector('[data-dom-id="cta-admin"]');
      if (ctaAdmin) ctaAdmin.addEventListener('click', function() { window.location.href = 'admin-login.html'; });

      // ===== Toast 提示 =====
      function showToast(message, type) {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;transition:opacity 0.3s;background:' + (type === 'error' ? 'rgba(199,92,92,0.95)' : type === 'warning' ? 'rgba(212,163,86,0.95)' : 'rgba(91,155,110,0.95)') + ';color:#fff;backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,0,0,0.3);';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(function() { toast.style.opacity = '0'; setTimeout(function() { toast.remove(); }, 300); }, 2800);
      }

      // ===== 收集表单数据 =====
      function collectProfileData() {
        var allChips = document.querySelectorAll('.mt-chip');
        var categoryChips = Array.prototype.filter.call(allChips, function(c) { return c.closest('#profile-form'); });
        var styleChips = Array.prototype.filter.call(allChips, function(c) { return !c.closest('#profile-form'); });
        var activeCategory = '';
        categoryChips.forEach(function(chip) {
          if (chip.classList.contains('active')) activeCategory = chip.textContent.trim();
        });
        var activeStyles = [];
        styleChips.forEach(function(chip) {
          if (chip.classList.contains('active')) activeStyles.push(chip.textContent.trim());
        });
        return {
          storeName: document.getElementById('store-name').value,
          category: activeCategory,
          phone: document.getElementById('store-phone').value,
          address: document.getElementById('store-address').value,
          styles: activeStyles
        };
      }

      // ===== 保存商家信息到 localStorage =====
      function saveProfile() {
        try {
          var data = collectProfileData();
          localStorage.setItem('meituan_merchant_profile', JSON.stringify(data));
          showToast('商家信息已保存');
        } catch (e) {
          showToast('保存失败，请重试', 'error');
        }
      }

      // ===== 顶部"保存"按钮 =====
      var headerButtons = document.querySelectorAll('header button');
      var topSaveBtn = Array.prototype.find.call(headerButtons, function(b) { return b.textContent.trim() === '保存'; });
      if (topSaveBtn) topSaveBtn.addEventListener('click', saveProfile);

      // ===== "编辑头像"按钮 =====
      var allButtons = document.querySelectorAll('button');
      var editAvatarBtn = Array.prototype.find.call(allButtons, function(b) { return b.textContent.trim() === '编辑头像'; });
      if (editAvatarBtn) editAvatarBtn.addEventListener('click', function() { showToast('头像编辑功能开发中'); });

      // ===== 经营品类 chips（单选/radio 行为） =====
      (function() {
        var allChips = document.querySelectorAll('.mt-chip');
        var categoryChips = Array.prototype.filter.call(allChips, function(c) { return c.closest('#profile-form'); });
        categoryChips.forEach(function(chip) {
          chip.addEventListener('click', function() {
            categoryChips.forEach(function(c) { c.classList.remove('active'); });
            chip.classList.add('active');
          });
        });
      })();

      // ===== 品牌风格偏好 chips（多选/checkbox 行为） =====
      (function() {
        var allChips = document.querySelectorAll('.mt-chip');
        var styleChips = Array.prototype.filter.call(allChips, function(c) { return !c.closest('#profile-form'); });
        styleChips.forEach(function(chip) {
          chip.addEventListener('click', function() {
            chip.classList.toggle('active');
          });
        });
      })();

      // ===== "保存修改"按钮 =====
      var saveBtn = document.querySelector('.mt-btn-gold');
      if (saveBtn) saveBtn.addEventListener('click', saveProfile);

      // ===== 参考图上传区域 =====
      var uploadArea = document.querySelector('div[style*="dashed"]');
      if (uploadArea) uploadArea.addEventListener('click', function() { showToast('图片上传功能开发中'); });
    </script>
</body>
</html>
