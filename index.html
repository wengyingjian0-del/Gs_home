<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gs Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">GitHub Pages Demo</p>
      <h1>你好，我的网站已经准备上线</h1>
      <p class="subtitle">
        这是一个由 TRAE 创建并部署到 GitHub Pages 的静态网站。你可以把它替换成个人主页、作品集、产品介绍页或项目 Demo。
      </p>
      <div class="actions">
        <a class="button primary" href="#features">查看内容</a>
        <a class="button secondary" href="https://github.com/wengyingjian0-del/Gs_home" target="_blank" rel="noreferrer">打开仓库</a>
      </div>
    </section>

    <section id="features" class="cards" aria-label="网站内容">
      <article class="card">
        <span class="icon">01</span>
        <h2>快速上线</h2>
        <p>使用 GitHub Pages 托管静态页面，无需服务器，也不需要额外运维。</p>
      </article>
      <article class="card">
        <span class="icon">02</span>
        <h2>自动部署</h2>
        <p>每次更新代码后，GitHub Actions 会自动发布最新版本。</p>
      </article>
      <article class="card">
        <span class="icon">03</span>
        <h2>方便替换</h2>
        <p>你可以继续让我修改文案、样式、版式，逐步变成真正的网站。</p>
      </article>
    </section>

    <section class="status">
      <h2>当前状态</h2>
      <p id="deploy-status">页面文件已创建，正在等待 GitHub Pages 部署。</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
